<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nos comptes — Je Raconte, Tu T'envoles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Literata:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
</head>
<body>

<nav>
  <div class="brand">Je Raconte, <span>Tu T'envoles</span></div>
  <ul>
    <li><a href="/#compagnie">La Compagnie</a></li>
    <li><a href="/#artistes">Les Artistes</a></li>
    <li><a href="/#spectacles">Spectacles</a></li>
    <li><a href="/#ateliers">Ateliers</a></li>
    <li><a href="/nos-comptes/">Nos Comptes</a></li>
  </ul>
</nav>

<section class="inner-page">
  <div class="inner-wrap">
    <div class="acte-tag">Retrouvez-nous</div>
    <h1 class="titre">Nos <em>comptes</em></h1>
    <div class="comptes-grid" id="comptes-grid"></div>
  </div>
</section>

<footer>© Je Raconte, Tu T'envoles — Conte &amp; Musique</footer>

<script>
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function getComptes(){
    const { data, error } = await sb
      .from('comptes')
      .select('*')
      .order('created_at', { ascending: false });
    if(error){ console.error(error); return []; }
    return data;
  }

  async function render(){
    const list = await getComptes();
    const grid = document.getElementById('comptes-grid');
    if(list.length === 0){
      grid.innerHTML = '<p class="empty-note">Aucun compte à afficher pour le moment.</p>';
      return;
    }
    grid.innerHTML = list.map(c => `
      <div class="compte-card">
        <h3>${c.titre}</h3>
        <span class="compte-nom">${c.texte}</span>
        ${c.lien_audio ? `<audio controls src="${c.lien_audio}"></audio><a class="audio-link" href="${c.lien_audio}" target="_blank" rel="noopener">Écouter / ouvrir le lien</a>` : ''}
      </div>
    `).join('');
  }

  render();
</script>
</body>
</html>
